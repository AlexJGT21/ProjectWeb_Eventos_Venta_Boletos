<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Header Principal -->
<header th:fragment="main-header" class="main-header">

    <!-- Logo -->
    <div class="header-logo">
        <a th:href="@{/index}">
            <img th:src="@{/img/Logotipo_FullColor.svg}" src="../static/img/Logotipo_FullColor.svg" alt="Konticket" class="logo-img">
        </a>
    </div>

    <!-- Buscador -->
    <div class="buscador">
            <span class="icono-buscador">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
        <input type="text" class="input-buscador" placeholder="Buscar eventos, artistas..." aria-label="Buscar">
    </div>

    <!-- Categorías -->
    <nav class="categorias-nav">
        <a href="#" class="categoria-link activa">Música</a>
        <a href="#" class="categoria-link">Festivales</a>
        <a href="#" class="categoria-link">Indie Rock</a>
        <a href="#" class="categoria-link">Electrónica</a>
    </nav>

    <!-- Acciones de Usuario -->
    <div class="acciones-usuario">
        <button type="button" class="accion-btn notificaciones-btn" aria-label="Notificaciones">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notificacion-seleccionada"></span>
        </button>

        <button type="button" class="accion-btn ticket-btn" aria-label="Mis entradas">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <line x1="6" y1="6" x2="6" y2="18"></line>
                <line x1="18" y1="6" x2="18" y2="18"></line>
            </svg>
            <span class="cuenta-ticket">2</span>
        </button>

        <label for="profile-menu-toggle" class="accion-btn perfil-btn" aria-label="Mi Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </label>
    </div>

</header>

<!-- Menú Lateral Desplegable -->
<aside th:fragment="perfil-sidebar" class="perfil-sidebar">
    <div class="user-card">
        <div class="user-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <div class="info-usuario">
            <span class="nombre-usuario">Emily Lara</span>
            <span class="rol-usuario">Fan & Organizador</span>
        </div>
        <div class="user-selector-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m7 15 5 5 5-5"></path>
                <path d="m7 9 5-5 5 5"></path>
            </svg>
        </div>
    </div>

    <div class="role-switcher">
        <button type="button" class="role-tab active">Asistente</button>
        <button type="button" class="role-tab">Organizador</button>
    </div>

    <nav class="sidebar-menu">
        <a th:href="@{/eventos}" class="sidebar-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>Explorar Eventos</span>
        </a>
        <a href="#" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <line x1="6" y1="6" x2="6" y2="18"></line>
                <line x1="18" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Mis Boletos</span>
            <span class="badge">2</span>
        </a>
        <a href="#" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Notificaciones</span>
        </a>
        <a href="#" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>Ajustes</span>
        </a>
    </nav>
</aside>

</body>
</html>
