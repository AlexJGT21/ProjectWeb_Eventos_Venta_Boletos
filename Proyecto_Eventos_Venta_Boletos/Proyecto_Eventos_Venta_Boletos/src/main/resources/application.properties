spring.application.name=Proyecto_Eventos_Venta_Boletos

#Limites de subida de imagenes para los banners de los evento
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Credenciales y ruta (Ajusta el nombre de la BD, usuario y contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/konticket_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=SQLLUCI

# Configuración JPA
# update crea o modifica las tablas automáticamente basándose en las clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
