spring.application.name=Proyecto_Eventos_Venta_Boletos

#Limites de subida de imagenes para los banners de los evento
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Credenciales y ruta (Ajusta el nombre de la BD, usuario y contraseña)
# Si tu MySQL usa otro usuario o contraseña, define las variables de entorno DB_USERNAME y DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/konticket_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${root}
spring.datasource.password=${123}

# Configuración JPA
# update crea o modifica las tablas automáticamente basándose en las clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cloudinary (imágenes de los eventos). Formato: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
# Se toma de la variable de entorno CLOUDINARY_URL para no subir las credenciales al repositorio
cloudinary.url=${CLOUDINARY_URL=}

# Carga eventos y compras de prueba al arrancar si la base no tiene eventos (ver config/DatosPrueba)
konticket.datos-prueba=true
