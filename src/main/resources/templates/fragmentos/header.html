<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Header Principal -->
<header th:fragment="main-header" class="main-header">

    <!-- Logo -->
    <div class="header-logo">
        <a th:href="@{/index}">
            <img th:src="@{/img/Logotipo_FullColor.svg}" src="/img/Logotipo_FullColor.svg" alt="Konticket" class="logo-img">
        </a>
    </div>

    <!-- Buscador: envía la búsqueda al catálogo (/eventos?q=...) -->
    <form class="buscador" th:action="@{/eventos}" method="get" role="search">
        <span class="icono-buscador">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </span>
        <input type="text" name="q" class="input-buscador" placeholder="Buscar eventos, artistas..." aria-label="Buscar"
               maxlength="80" th:value="${param.q != null ? param.q[0] : ''}">
    </form>

    <!-- Categorías: buscan en el catálogo (nombre, descripción, categoría o lugar) -->
    <nav class="categorias-nav">
        <a th:href="@{/eventos(q='Música')}" class="categoria-link"
           th:classappend="${param.q != null and param.q[0] == 'Música'} ? 'activa'">Música</a>
        <a th:href="@{/eventos(q='Festivales')}" class="categoria-link"
           th:classappend="${param.q != null and param.q[0] == 'Festivales'} ? 'activa'">Festivales</a>
        <a th:href="@{/eventos(q='Indie Rock')}" class="categoria-link"
           th:classappend="${param.q != null and param.q[0] == 'Indie Rock'} ? 'activa'">Indie Rock</a>
        <a th:href="@{/eventos(q='Electrónica')}" class="categoria-link"
           th:classappend="${param.q != null and param.q[0] == 'Electrónica'} ? 'activa'">Electrónica</a>
    </nav>

    <!-- Acciones de Usuario -->
    <div class="acciones-usuario">
        <!-- Notificaciones: abre un panel; el punto rosa solo debe mostrarse cuando haya notificaciones nuevas -->
        <button type="button" class="accion-btn notificaciones-btn" aria-label="Notificaciones" popovertarget="panel-notificaciones">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>
        <div id="panel-notificaciones" popover
             style="position: fixed; inset: auto; top: 70px; right: 24px; margin: 0; width: 280px; padding: 16px; border: 1px solid #e4e6ef; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); font-size: 14px; color: #1e1e2d; background: #fff;">
            <strong style="display: block; margin-bottom: 6px;">Notificaciones</strong>
            <span style="color: #7e8299;">No tienes notificaciones nuevas.</span>
        </div>

        <!-- Acceso a Mis Boletos -->
        <a th:href="@{/mis-boletos}" href="/mis-boletos" class="accion-btn ticket-btn" aria-label="Mis entradas" title="Mis boletos">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <line x1="6" y1="6" x2="6" y2="18"></line>
                <line x1="18" y1="6" x2="18" y2="18"></line>
            </svg>
        </a>

        <label for="profile-menu-toggle" class="accion-btn perfil-btn" aria-label="Mi Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </label>
    </div>

</header>

<!-- Menú Lateral Desplegable (Invitado o con sesión) -->
<aside th:fragment="perfil-sidebar" class="perfil-sidebar">

    <!-- Tarjeta de Invitado / Iniciar Sesión -->
    <div class="auth-guest-card" th:unless="${sesionActiva}">
        <div class="guest-header">
            <div class="guest-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div class="info-invitado">
                <span class="titulo-invitado">¡Bienvenido!</span>
                <span class="subtitulo-invitado">Accede a tus entradas y perfil</span>
            </div>
        </div>

        <!-- Botón Principal Redirección a Login -->
        <a th:href="@{/user-login}" href="/user-login" class="btn-sidebar-login">
            <span>INICIAR SESIÓN</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
        </a>

    </div>

    <!-- Tarjeta de Usuario con sesión -->
    <div class="user-card" th:if="${sesionActiva}">
        <div class="user-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <div class="info-usuario">
            <span class="nombre-usuario" th:text="${usuarioNombre}">Nombre</span>
            <span class="rol-usuario" th:text="${esOrganizador} ? 'Organizador' : ${usuarioCorreo}">Organizador</span>
        </div>
    </div>

    <!-- Navegación General -->
    <nav class="sidebar-menu">
        <a th:href="@{/eventos}" class="sidebar-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>Explorar Eventos</span>
        </a>
        <a th:href="@{/mis-boletos}" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <line x1="6" y1="6" x2="6" y2="18"></line>
                <line x1="18" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Mis Boletos</span>
        </a>

        <!-- Solo visibles para organizadores -->
        <a th:if="${esOrganizador}" th:href="@{/organizador/panel}" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
            <span>Panel Organizador</span>
        </a>
        <a th:if="${esOrganizador}" th:href="@{/organizador/evento/nuevo}" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            <span>Crear Evento</span>
        </a>

        <a href="#" class="sidebar-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Ayuda y Soporte</span>
        </a>

        <!-- Cerrar sesión (Spring Security exige POST con token CSRF; th:action lo agrega solo) -->
        <form th:if="${sesionActiva}" th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="sidebar-item" style="width: 100%; background: none; border: none; cursor: pointer; font-family: inherit; text-align: left;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Cerrar Sesión</span>
            </button>
        </form>
    </nav>

</aside>

</body>
</html>
